<main class="page-content">
  <app-filters (triggerSearch)="onFilterSearch()" />

  @if (isLoading() && isFirstPage()) {
  <div class="loading-state" role="status" aria-label="Loading Pokémon">
    <mat-spinner />
  </div>
  }

  <section class="pokemon-grid" aria-label="Pokémon">
    @for (row of data(); track row.id) {
      <a
        class="pokemon-link"
        [routerLink]="['/pokemon/', row.identifier]"
        [attr.aria-label]="
          (row.species_names | pokemonSpeciesName : languageService.langId()) +
          ' details'
        "
      >
        <mat-card
          appearance="outlined"
          class="pokemon-card"
        >
          <mat-card-header>
            <mat-card-subtitle>
              {{
                row.species_names
                  | pokemonSpeciesName : languageService.langId()
              }}
            </mat-card-subtitle>
          </mat-card-header>

          <mat-card-content>
            <div class="image-container">
              <img
                [ngSrc]="row.id | pokemonImage : pokemonSpriteTypePath.FRONT"
                width="96"
                height="96"
                [alt]="
                  row.species_names
                    | pokemonSpeciesName : languageService.langId()
                "
              />
            </div>
          </mat-card-content>
        </mat-card>
      </a>
    }

    <div #loadMoreAnchor class="load-more-anchor" aria-hidden="true"></div>
  </section>

  @if (!isLoading() && data().length === 0) {
  <p class="empty-state muted-text" role="status">
    {{ "table.noResult" | translate }}
  </p>
  }

  @if (isLoading() && !isFirstPage()) {
  <mat-progress-bar mode="query" class="loading-progress" />
  }
</main>
