<mat-toolbar class="app-toolbar">
  <a
    matButton="text"
    class="brand-link"
    [routerLink]="['']"
    aria-label="Pokedex home"
  >
    <span>Pokedex</span>
  </a>
  <nav class="saved-pokemon" aria-label="Recently viewed Pokémon">
    @for (node of sidenavService.nodes(); track node.url) {
    <span class="saved-pokemon-item">
      <a matButton="text" [routerLink]="node.url">
        {{
          node.name | pokemonSpeciesName : languageService.langId() | titlecase
        }}
      </a>
      <button
        matIconButton
        type="button"
        [attr.aria-label]="'Remove ' + (node.name | pokemonSpeciesName : languageService.langId())"
        (click)="sidenavService.removeNode(node.name)"
      >
        <mat-icon>close</mat-icon>
      </button>
    </span>
    }
  </nav>
  <span class="toolbar-spacer"></span>
  <a
    matIconButton
    target="_blank"
    rel="noopener noreferrer"
    href="https://github.com/Kerrders/Pokedex"
    matTooltip="Repository"
    aria-label="Pokedex source repository"
  >
    <img src="./assets/images/github-mark.svg" alt="" />
  </a>
  <mat-button-toggle-group
    class="language-select-button-group"
    appearance="standard"
    [hideSingleSelectionIndicator]="true"
    aria-label="Language"
    [(ngModel)]="actualLanguage"
    (ngModelChange)="onChangeLanguage()"
  >
    @for (lang of languageService.getAvailableLanguages() | keyvalue; track
    lang.key) {
    <mat-button-toggle [value]="lang.key">
      {{ "langs." + lang.key | translate }}
    </mat-button-toggle>
    }
  </mat-button-toggle-group>
</mat-toolbar>
