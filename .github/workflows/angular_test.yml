name: Angular CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
jobs:
  test:
    name: Run angular tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3

      - name: Install and run tests
        run: |
          npm ci
          npm run update
          npm run test
